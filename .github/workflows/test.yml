name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned: an unpinned formatter turns a new ruff release into a red
      # build on a branch nobody has touched.
      - run: pip install ruff==0.15.8
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest -q

  test-core:
    name: Pytest (running core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # tests_ha/ sets entries up through Home Assistant itself, so it needs
      # pytest-homeassistant-custom-component and the core release it pins.
      - name: Install
        run: pip install -r requirements-test-ha.txt
      # The timeout turns a speedtest wait that never ends into a failure
      # rather than a job that runs until GitHub kills it.
      - name: Run tests
        run: pytest -q tests_ha --timeout 60
