name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a hassfest or HACS rule introduced after the last commit
    # is noticed here rather than by a user.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The brands check requires the domain to be registered in
          # home-assistant/brands, which is for integrations shipped with
          # Home Assistant. This one is installed as a HACS custom
          # repository and carries its own icon under brand/.
          ignore: brands
